name: enrich-issues
# Manual only. Enrichment now runs inside the Render process (see FeedStore in
# src/store.ts): it picks candidates from the in-memory snapshot, calls GitHub,
# and lets the results ride along on the next batched flush, so a full
# re-verification pass costs zero extra Neon compute windows.
#
# This workflow remains as a break-glass path for running a pass against
# Postgres directly when the API is not up. It writes through immediately, so
# each run wakes the compute for a full autosuspend window; do not put it back
# on a schedule.
on:
  workflow_dispatch: {}
jobs:
  enrich:
    runs-on: ubuntu-latest
    concurrency:
      group: enrich-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      # Manual runs may predate a schema change, so migrate here (idempotent).
      - run: npm run migrate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_FEED_TOKEN }} # loadConfig requires it even for migrate
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GH_FEED_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENRICH_MAX_ISSUES: "500"
          RETENTION_DAYS: "2"