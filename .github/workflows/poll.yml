name: poll-issues
# Disaster recovery only. Primary polling is the Render service, which holds the
# feed in memory and batches its writes; this workflow writes straight through to
# Postgres, so every run wakes the Neon compute for a full five-minute autosuspend
# window. At the old */30 cadence that was ~31 CU-hrs/month, a third of the free
# allowance, for a path that only matters while Render is down (and while Render is
# down, nobody can read the feed anyway).
#
# The daily run is a cheap floor: it keeps the watermark moving and the table
# populated through a multi-day outage, for ~0.6 CU-hrs/month. The API absorbs
# whatever it writes on its next snapshot reload (SNAPSHOT_RELOAD_MINUTES).
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}
jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:              # never overlap runs
      group: poll-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      # No migrate step: Render migrates on start, and re-running four DDL
      # statements here only bought another compute window.
      - run: npm run poll:once
        env:
          # Custom PAT secret, NOT the auto-injected GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_FEED_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STARS_MIN: "100"
          BACKFILL_HOURS: "24"
          LANGUAGES: "javascript,typescript,python,go,rust,java"