services:
  - type: web
    name: issuefeed
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GITHUB_TOKEN # classic PAT, no scopes (public data only)
        sync: false
      - key: DATABASE_URL # Neon POOLED connection string (host has -pooler)
        sync: false
      - key: POLL_TRIGGER_TOKEN # shared secret for /internal/poll
        generateValue: true
      - key: POLL_INTERVAL_SECONDS # match the external pinger cadence so the UI countdown is honest
        value: "300"
      - key: STARS_MIN
        value: "100"
      - key: BACKFILL_HOURS
        value: "24"
      - key: LANGUAGES
        value: javascript,typescript,python,go,rust,java
      - key: ENRICH_MAX_ISSUES
        value: "500"
      - key: RETENTION_DAYS # 2-day freshness window; also small enough that one
        value: "2"          # enrich pass re-verifies the whole feed
      # Neon bills wall-clock time its compute is awake and autosuspends after 5
      # idle minutes, so a write window costs ~5 minutes however small the batch.
      # Reads never touch Postgres (see src/store.ts); these three knobs are the
      # entire database workload.
      - key: DB_FLUSH_MINUTES # 48 wakes/day ~= 32 CU-hrs/month of the 100 free
        value: "30"
      - key: ENRICH_INTERVAL_MINUTES # GitHub-only; results ride the next flush
        value: "360"
      - key: SNAPSHOT_RELOAD_MINUTES # re-sync after a flush, never its own wake
        value: "360"